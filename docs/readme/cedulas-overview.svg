<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Flujo operativo de Cédulas EJE</title>
  <desc id="desc">Un PDF se analiza y se divide en remitir, observar o revisar antes de trabajar en EJE.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdfa"/>
      <stop offset="1" stop-color="#f3ecee"/>
    </linearGradient>
    <linearGradient id="wine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a0d1b"/>
      <stop offset="1" stop-color="#a91f3a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#34131b" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1280" height="720" rx="34" fill="url(#bg)"/>
  <rect x="34" y="30" width="1212" height="80" rx="18" fill="url(#wine)"/>
  <text x="62" y="65" fill="#fff" font-family="Segoe UI, Arial" font-size="25" font-weight="800">Cédulas EJE</text>
  <text x="62" y="90" fill="#f3dfe4" font-family="Segoe UI, Arial" font-size="13" font-weight="600">Del PDF al lote, con evidencia visible y revisión humana</text>
  <g transform="translate(1080 50)">
    <rect width="136" height="40" rx="20" fill="#fff" opacity="0.13"/>
    <text x="68" y="26" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial" font-size="13" font-weight="700">PROCESO LOCAL</text>
  </g>
  <text x="58" y="162" fill="#821529" font-family="Segoe UI, Arial" font-size="14" font-weight="800" letter-spacing="1.5">1 · DOCUMENTO</text>
  <g transform="translate(58 188)" filter="url(#shadow)">
    <rect width="292" height="390" rx="24" fill="#fff" stroke="#e6d9dc"/>
    <rect x="28" y="28" width="236" height="42" rx="8" fill="#f7f1f2"/>
    <text x="46" y="54" fill="#821529" font-family="Segoe UI, Arial" font-size="13" font-weight="800">ACTUACIONES EN PDF</text>
    <rect x="28" y="90" width="236" height="250" rx="12" fill="#fffdfa" stroke="#ddd5d6"/>
    <rect x="47" y="113" width="198" height="14" rx="7" fill="#d9dde2"/>
    <rect x="47" y="140" width="145" height="10" rx="5" fill="#e5e8eb"/>
    <rect x="47" y="168" width="172" height="22" rx="7" fill="#f6dfb5"/>
    <text x="54" y="184" fill="#6b4b15" font-family="Consolas, monospace" font-size="12" font-weight="700">539253/2026</text>
    <rect x="47" y="207" width="198" height="10" rx="5" fill="#e5e8eb"/>
    <rect x="47" y="230" width="184" height="10" rx="5" fill="#e5e8eb"/>
    <rect x="47" y="258" width="198" height="39" rx="8" fill="#f5e9ec"/>
    <text x="55" y="276" fill="#821529" font-family="Segoe UI, Arial" font-size="10" font-weight="700">“remítase digitalmente…”</text>
    <text x="55" y="290" fill="#821529" font-family="Segoe UI, Arial" font-size="10" font-weight="700">“Oficina de Notificaciones…”</text>
    <rect x="47" y="312" width="121" height="10" rx="5" fill="#e5e8eb"/>
    <text x="146" y="370" text-anchor="middle" fill="#7a838e" font-family="Segoe UI, Arial" font-size="12" font-weight="600">texto seleccionable · página por página</text>
  </g>
  <path d="M380 383h86" stroke="#b99655" stroke-width="5" stroke-linecap="round"/>
  <path d="m455 370 18 13-18 13" fill="none" stroke="#b99655" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="480" y="162" fill="#821529" font-family="Segoe UI, Arial" font-size="14" font-weight="800" letter-spacing="1.5">2 · ANÁLISIS</text>
  <g transform="translate(480 214)" filter="url(#shadow)">
    <rect width="300" height="338" rx="28" fill="#1a2028"/>
    <circle cx="150" cy="92" r="56" fill="#821529"/>
    <path d="M122 92h56M150 64v56" stroke="#fffdfa" stroke-width="8" stroke-linecap="round"/>
    <text x="150" y="181" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial" font-size="23" font-weight="800">Motor de decisión</text>
    <text x="150" y="211" text-anchor="middle" fill="#abb5c0" font-family="Segoe UI, Arial" font-size="13">normaliza · separa códigos</text>
    <text x="150" y="232" text-anchor="middle" fill="#abb5c0" font-family="Segoe UI, Arial" font-size="13">relaciona verbo · pieza · oficina</text>
    <rect x="42" y="265" width="216" height="42" rx="21" fill="#fff" opacity="0.08"/>
    <text x="150" y="291" text-anchor="middle" fill="#f0d8de" font-family="Segoe UI, Arial" font-size="13" font-weight="700">conserva evidencia y ambigüedad</text>
  </g>
  <path d="M806 383h78" stroke="#b99655" stroke-width="5" stroke-linecap="round"/>
  <path d="m873 370 18 13-18 13" fill="none" stroke="#b99655" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="902" y="162" fill="#821529" font-family="Segoe UI, Arial" font-size="14" font-weight="800" letter-spacing="1.5">3 · RESULTADO</text>
  <g transform="translate(902 188)" filter="url(#shadow)">
    <rect width="320" height="390" rx="24" fill="#fff" stroke="#e6d9dc"/>
    <g transform="translate(24 26)">
      <rect width="272" height="88" rx="16" fill="#edf7f3" stroke="#b9dfd0"/>
      <circle cx="32" cy="44" r="18" fill="#2f7d5c"/>
      <path d="m23 44 7 7 13-15" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="62" y="38" fill="#245f49" font-family="Segoe UI, Arial" font-size="17" font-weight="800">Remitir</text>
      <text x="62" y="60" fill="#577267" font-family="Segoe UI, Arial" font-size="11">seleccionar para Crear lote</text>
    </g>
    <g transform="translate(24 132)">
      <rect width="272" height="88" rx="16" fill="#f5e9ec" stroke="#e6c4cc"/>
      <circle cx="32" cy="44" r="18" fill="#821529"/>
      <path d="M24 36l16 16M40 36 24 52" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <text x="62" y="38" fill="#821529" font-family="Segoe UI, Arial" font-size="17" font-weight="800">Observar</text>
      <text x="62" y="60" fill="#87656e" font-family="Segoe UI, Arial" font-size="11">copiar expediente y abrir EJE</text>
    </g>
    <g transform="translate(24 238)">
      <rect width="272" height="88" rx="16" fill="#fff3dc" stroke="#ead09e"/>
      <circle cx="32" cy="44" r="18" fill="#b47a22"/>
      <text x="32" y="50" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial" font-size="20" font-weight="900">?</text>
      <text x="62" y="38" fill="#835917" font-family="Segoe UI, Arial" font-size="17" font-weight="800">Revisar</text>
      <text x="62" y="60" fill="#897456" font-family="Segoe UI, Arial" font-size="11">evidencia insuficiente o mixta</text>
    </g>
    <text x="160" y="365" text-anchor="middle" fill="#7a838e" font-family="Segoe UI, Arial" font-size="12" font-weight="600">nada se incorpora sin confirmación</text>
  </g>
  <g transform="translate(58 620)">
    <rect width="1164" height="56" rx="18" fill="#1a2028"/>
    <text x="30" y="35" fill="#fffdfa" font-family="Segoe UI, Arial" font-size="14" font-weight="800">EJE</text>
    <text x="82" y="35" fill="#adb7c1" font-family="Segoe UI, Arial" font-size="13">lista aprobada → marcador de carga</text>
    <circle cx="465" cy="28" r="4" fill="#b99655"/>
    <text x="488" y="35" fill="#adb7c1" font-family="Segoe UI, Arial" font-size="13">cédula observada → expediente copiado</text>
    <circle cx="840" cy="28" r="4" fill="#b99655"/>
    <text x="863" y="35" fill="#adb7c1" font-family="Segoe UI, Arial" font-size="13">decisión final → usuario</text>
  </g>
</svg>
